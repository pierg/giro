<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 20 900 356" role="img" aria-label="Your chat session (the grill, spec and plan skills, and a thin /giro skill) and your terminal, CI or cron both drive the giro CLI, the loop engine: state machine, budgets and escalation, gate runner, wave scheduler. The CLI spawns a worker context that returns a JSON envelope, and a fresh, blind judge context that returns a verdict with findings. needs-human escalations flow back to the chat. State lives in local markdown beside the code, so a run can resume." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
svg{--ink:#dbe3e9;--ink-soft:#9aa8b1;--ink-faint:#69767f;--rule:#253039;--brass:#d4a35c;--pass:#46b491;--escalate:#e07257;--panel-2:#101820;}
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.box{fill:var(--panel-2);stroke:var(--ink-soft);stroke-width:1.6}
.box-brass{fill:var(--panel-2);stroke:var(--brass);stroke-width:1.8}
.box-dash{fill:none;stroke:var(--ink-faint);stroke-width:1.4;stroke-dasharray:4 4}
.edge{fill:none;stroke:var(--ink-soft);stroke-width:1.6}
.e-esc{fill:none;stroke:var(--escalate);stroke-width:1.7}
.fill-ink{fill:var(--ink-soft)}.fill-esc{fill:var(--escalate)}
.txt{fill:var(--ink);font-size:15px;font-weight:600}
.big{fill:var(--ink);font-size:17px;font-weight:650}
.body{fill:var(--ink);font-size:14px;font-weight:500}
.mono{font-family:ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace}
.lab{fill:var(--ink-soft);font-size:13px;letter-spacing:.06em}
.edge-t{fill:var(--ink-soft);font-size:13px}
.brass{fill:var(--brass);font-size:13px;letter-spacing:.08em;font-weight:700}
.esc{fill:var(--escalate);font-size:13px}
.note{fill:var(--ink-soft);font-size:13px}
</style>
<defs>
<marker id="a-ink" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" class="fill-ink"/></marker>
<marker id="a-esc" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" class="fill-esc"/></marker>
</defs>

<!-- chat session -->
<rect class="box-dash" x="16" y="40" width="240" height="186" rx="10"/>
<text class="lab mono" x="32" y="64">YOUR CHAT SESSION</text>
<rect class="box" x="32" y="76" width="208" height="54" rx="7"/>
<text class="txt" x="136" y="98" text-anchor="middle">authoring skills</text>
<text class="note mono" x="136" y="119" text-anchor="middle">grill · spec · plan</text>
<rect class="box" x="32" y="142" width="208" height="62" rx="7"/>
<text class="txt mono" x="136" y="167" text-anchor="middle">/giro</text>
<text class="note" x="136" y="190" text-anchor="middle">thin, calls the CLI</text>

<!-- terminal -->
<rect class="box" x="32" y="300" width="208" height="56" rx="7"/>
<text class="txt" x="136" y="324" text-anchor="middle">terminal · CI · cron</text>
<text class="note" x="136" y="344" text-anchor="middle">same command, headless</text>

<!-- CLI -->
<rect class="box-brass" x="372" y="40" width="212" height="232" rx="10"/>
<text class="big" x="478" y="72" text-anchor="middle">giro CLI</text>
<text class="brass mono" x="478" y="94" text-anchor="middle">THE LOOP ENGINE</text>
<text class="body" x="478" y="134" text-anchor="middle">state machine</text>
<text class="body" x="478" y="164" text-anchor="middle">budgets · escalation</text>
<text class="body" x="478" y="194" text-anchor="middle">gate runner</text>
<text class="body" x="478" y="224" text-anchor="middle">wave scheduler</text>

<!-- state -->
<rect class="box" x="372" y="300" width="212" height="56" rx="7"/>
<text class="txt" x="478" y="324" text-anchor="middle">state · local markdown</text>
<text class="note" x="478" y="344" text-anchor="middle">beside the code, resumable</text>

<!-- worker, judge -->
<rect class="box" x="680" y="56" width="204" height="64" rx="8"/>
<text class="txt" x="782" y="82" text-anchor="middle">Worker context</text>
<text class="note mono" x="782" y="104" text-anchor="middle">prompts/worker.md</text>
<rect class="box" x="680" y="172" width="204" height="64" rx="8"/>
<text class="txt" x="782" y="198" text-anchor="middle">Judge context</text>
<text class="note" x="782" y="220" text-anchor="middle">blind · criterion or rubric</text>

<!-- edges: chat and CLI -->
<path class="edge" d="M240,162 L371,162" marker-end="url(#a-ink)"/>
<text class="edge-t mono" x="314" y="153" text-anchor="middle">run · resume</text>
<path class="e-esc" d="M372,186 L241,186" marker-end="url(#a-esc)"/>
<text class="esc mono" x="314" y="204" text-anchor="middle">needs-human</text>
<path class="edge" d="M136,300 L136,252 L371,252" marker-end="url(#a-ink)"/>
<text class="edge-t mono" x="254" y="244" text-anchor="middle">no chat needed</text>

<!-- edges: CLI and contexts -->
<path class="edge" d="M584,76 L679,76" marker-end="url(#a-ink)"/>
<text class="edge-t mono" x="632" y="67" text-anchor="middle">spawn</text>
<path class="edge" d="M680,100 L585,100" marker-end="url(#a-ink)"/>
<text class="edge-t mono" x="632" y="118" text-anchor="middle">envelope</text>
<path class="edge" d="M584,192 L679,192" marker-end="url(#a-ink)"/>
<text class="edge-t mono" x="632" y="183" text-anchor="middle">spawn fresh</text>
<path class="edge" d="M680,216 L585,216" marker-end="url(#a-ink)"/>
<text class="edge-t mono" x="632" y="234" text-anchor="middle">verdict</text>

<!-- edges: CLI and state -->
<path class="edge" d="M466,272 L466,299" marker-end="url(#a-ink)"/>
<path class="edge" d="M490,300 L490,273" marker-end="url(#a-ink)"/>
<text class="edge-t mono" x="502" y="291">reads / writes</text>
</svg>
