<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 426" role="img" aria-label="One file, two zones. In docs/specs/payment-retry/SPEC.md the frontmatter (state, base, blocked_by, attempts) is the engine's zone, the body (problem, solution, user stories, acceptance criteria, out of scope) is your zone, and attempt logs are appended at the end. The conversation scaffolds the file with giro new and writes only the body; the engine writes the frontmatter state and appends the logs. giro implement passes the baton to the engine; needs-human passes it back." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
svg{--ink:#17212a;--ink-soft:#45535d;--ink-faint:#7b8892;--rule:#ccd5db;--brass:#a06f22;--pass:#257f66;--escalate:#b5482f;--panel-2:#eef2f4;}
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.box{fill:var(--panel-2);stroke:var(--ink-soft);stroke-width:1.6}
.box-brass{fill:var(--panel-2);stroke:var(--brass);stroke-width:1.7}
.box-dash{fill:none;stroke:var(--ink-faint);stroke-width:1.4;stroke-dasharray:4 4}
.log{fill:none;stroke:var(--ink-soft);stroke-width:1.4;stroke-dasharray:4 4}
.container{fill:none;stroke:var(--brass);stroke-width:1.7}
.edge{fill:none;stroke:var(--ink-soft);stroke-width:1.6}
.e-brass{fill:none;stroke:var(--brass);stroke-width:1.7}
.e-esc{fill:none;stroke:var(--escalate);stroke-width:1.7}
.fill-ink{fill:var(--ink-soft)}.fill-brass{fill:var(--brass)}.fill-esc{fill:var(--escalate)}
.txt{fill:var(--ink);font-size:15px;font-weight:600}
.body{fill:var(--ink);font-size:14px;font-weight:500}
.mono{font-family:ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace}
.code{fill:var(--ink-soft);font-size:13px}
.code-b{fill:var(--ink);font-size:13.5px;font-weight:700}
.lab{fill:var(--ink-soft);font-size:13px;letter-spacing:.06em}
.lab-brass{fill:var(--brass);font-size:13px;letter-spacing:.06em;font-weight:700}
.l-brass{fill:var(--brass);font-size:13px}
.l-esc{fill:var(--escalate);font-size:13px}
.note{fill:var(--ink-soft);font-size:13px}
</style>
<defs>
<marker id="a-ink" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" class="fill-ink"/></marker>
<marker id="a-brass" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" class="fill-brass"/></marker>
<marker id="a-esc" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" class="fill-esc"/></marker>
</defs>

<!-- batons -->
<path class="e-esc" d="M774,72 C774,22 126,22 126,71" marker-end="url(#a-esc)"/>
<text class="l-esc mono" x="450" y="24" text-anchor="middle">needs-human: the baton comes back</text>
<path class="e-brass" d="M126,360 C126,410 774,410 774,361" marker-end="url(#a-brass)"/>
<text class="l-brass mono" x="450" y="420" text-anchor="middle">giro implement: the baton passes to the engine</text>

<!-- conversation -->
<rect class="box-dash" x="16" y="72" width="220" height="288" rx="10"/>
<text class="lab mono" x="32" y="96">CONVERSATION</text>
<rect class="box-brass" x="32" y="110" width="188" height="56" rx="7"/>
<text class="txt mono" x="126" y="133" text-anchor="middle" style="font-size:14px">giro new spec|issue</text>
<text class="note" x="126" y="154" text-anchor="middle">scaffolds the file</text>
<rect class="box" x="32" y="190" width="188" height="56" rx="7"/>
<text class="txt" x="126" y="213" text-anchor="middle">spec · plan</text>
<text class="note" x="126" y="234" text-anchor="middle">write the body</text>
<rect class="box" x="32" y="270" width="188" height="56" rx="7"/>
<text class="txt" x="126" y="293" text-anchor="middle">answer escalations</text>
<text class="note" x="126" y="314" text-anchor="middle">edit the body, re-run</text>

<!-- the file -->
<text class="code mono" x="450" y="64" text-anchor="middle">docs/specs/payment-retry/SPEC.md</text>
<rect class="box-brass" x="300" y="72" width="300" height="88" rx="8"/>
<text class="code mono" x="316" y="94">---</text>
<text class="lab-brass mono" x="584" y="94" text-anchor="end">ENGINE ZONE</text>
<text class="code-b mono" x="316" y="114">state: draft → active → done</text>
<text class="code mono" x="316" y="133">base · blocked_by · attempts</text>
<text class="code mono" x="316" y="152">---</text>
<rect class="box" x="300" y="160" width="300" height="114" rx="8"/>
<text class="code-b mono" x="316" y="184"># Payment retry</text>
<text class="lab mono" x="584" y="184" text-anchor="end">YOUR ZONE</text>
<text class="code mono" x="316" y="206">problem · solution</text>
<text class="code mono" x="316" y="225">user stories</text>
<text class="code mono" x="316" y="244">acceptance criteria</text>
<text class="code mono" x="316" y="263">out of scope</text>
<rect class="log" x="300" y="274" width="300" height="86" rx="8"/>
<text class="code-b mono" x="316" y="298">## Attempt 2: gates failed</text>
<text class="code mono" x="316" y="320">- test: exited 1</text>
<text class="lab mono" x="584" y="320" text-anchor="end">APPEND-ONLY</text>
<text class="code mono" x="316" y="340">- judge: missing edge case</text>

<!-- engine -->
<rect class="container" x="664" y="72" width="220" height="288" rx="10"/>
<text class="lab-brass mono" x="680" y="96">GIRO ENGINE</text>
<text class="body" x="774" y="150" text-anchor="middle">plans · claims · waves</text>
<text class="body" x="774" y="182" text-anchor="middle">workers · gates</text>
<text class="body" x="774" y="214" text-anchor="middle">verdicts · budgets</text>
<text class="body" x="774" y="246" text-anchor="middle">commits · escalates</text>

<!-- writes -->
<path class="edge" d="M220,138 L299,116" marker-end="url(#a-ink)"/>
<path class="edge" d="M220,218 L299,218" marker-end="url(#a-ink)"/>
<path class="edge" d="M220,298 L262,298 L262,244 L299,244" marker-end="url(#a-ink)"/>
<path class="e-brass" d="M664,110 L601,110" marker-end="url(#a-brass)"/>
<text class="l-brass mono" x="632" y="101" text-anchor="middle">state</text>
<path class="e-brass" d="M664,318 L601,318" marker-end="url(#a-brass)"/>
<text class="l-brass mono" x="632" y="309" text-anchor="middle">log</text>
</svg>
