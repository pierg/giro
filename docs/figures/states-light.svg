<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 466" role="img" aria-label="Issue states: blocked is computed from blocked_by; ready, then in-progress when an attempt is claimed. Verify pass goes to done. On a fail with budget left the Issue returns to ready with its findings; with the budget spent, or when the worker escalates, it goes to needs-human. Re-running giro implement returns it to ready with attempts reset. A human can set wontfix from any state. Spec states: draft, then active on the first giro implement. Active runs waves and Validate. When every Issue is terminal and Validate is green it is done and you merge giro/slug. An Issue stuck in needs-human or a spent validate budget sends it to needs-human; re-running giro implement returns it to active with gap_cycles reset." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
svg{--ink:#17212a;--ink-soft:#45535d;--ink-faint:#7b8892;--rule:#ccd5db;--brass:#a06f22;--pass:#257f66;--escalate:#b5482f;--panel-2:#eef2f4;}
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.box{fill:var(--panel-2);stroke:var(--ink-soft);stroke-width:1.6}
.box-pass{fill:var(--panel-2);stroke:var(--pass);stroke-width:1.7}
.box-esc{fill:var(--panel-2);stroke:var(--escalate);stroke-width:1.7}
.box-dash{fill:var(--panel-2);stroke:var(--ink-faint);stroke-width:1.4;stroke-dasharray:4 4}
.edge{fill:none;stroke:var(--ink-soft);stroke-width:1.6}
.e-human{fill:none;stroke:var(--ink-soft);stroke-width:1.5;stroke-dasharray:5 4}
.e-brass{fill:none;stroke:var(--brass);stroke-width:1.7}
.e-pass{fill:none;stroke:var(--pass);stroke-width:1.7}
.e-esc{fill:none;stroke:var(--escalate);stroke-width:1.7}
.fill-ink{fill:var(--ink-soft)}.fill-brass{fill:var(--brass)}.fill-pass{fill:var(--pass)}.fill-esc{fill:var(--escalate)}
.txt{fill:var(--ink);font-size:15px;font-weight:600}
.mono{font-family:ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace}
.lab{fill:var(--ink-soft);font-size:13px;letter-spacing:.04em}
.lane{fill:var(--brass);font-size:13px;letter-spacing:.08em;font-weight:700}
.l-brass{fill:var(--brass);font-size:13px}
.l-pass{fill:var(--pass);font-size:13px}
.l-esc{fill:var(--escalate);font-size:13px}
.note{fill:var(--ink-soft);font-size:13px}
</style>
<defs>
<marker id="a-ink" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" class="fill-ink"/></marker>
<marker id="a-brass" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" class="fill-brass"/></marker>
<marker id="a-pass" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" class="fill-pass"/></marker>
<marker id="a-esc" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" class="fill-esc"/></marker>
</defs>

<!-- ============ ISSUE ============ -->
<text class="lane mono" x="16" y="30">ISSUE</text>
<rect class="box-dash" x="16" y="48" width="96" height="44" rx="7"/>
<text class="txt" x="64" y="75" text-anchor="middle">blocked</text>
<text class="note" x="64" y="112" text-anchor="middle">computed</text>
<rect class="box" x="160" y="48" width="88" height="44" rx="7"/>
<text class="txt" x="204" y="75" text-anchor="middle">ready</text>
<rect class="box" x="310" y="48" width="126" height="44" rx="7"/>
<text class="txt" x="373" y="75" text-anchor="middle">in-progress</text>
<polygon class="box" points="510,36 556,70 510,104 464,70"/>
<text class="lab mono" x="510" y="75" text-anchor="middle">Verify</text>
<rect class="box-pass" x="612" y="48" width="100" height="44" rx="7"/>
<text class="txt" x="662" y="75" text-anchor="middle">done</text>
<rect class="box-dash" x="776" y="48" width="108" height="44" rx="7"/>
<text class="txt" x="830" y="75" text-anchor="middle">wontfix</text>
<text class="note" x="830" y="112" text-anchor="middle">you, from any state</text>

<polygon class="box" points="510,126 562,162 510,198 458,162"/>
<text class="lab mono" x="510" y="159" text-anchor="middle">budget</text>
<text class="lab mono" x="510" y="175" text-anchor="middle">left?</text>
<rect class="box-esc" x="612" y="140" width="130" height="44" rx="7"/>
<text class="txt" x="677" y="167" text-anchor="middle">needs-human</text>
<text class="note" x="752" y="158">or the worker</text>
<text class="note" x="752" y="175">escalates</text>

<path class="edge" d="M112,70 L159,70" marker-end="url(#a-ink)"/>
<text class="lab mono" x="136" y="62" text-anchor="middle">deps</text>
<path class="edge" d="M248,70 L309,70" marker-end="url(#a-ink)"/>
<text class="lab mono" x="279" y="62" text-anchor="middle">claim</text>
<path class="edge" d="M436,70 L463,70" marker-end="url(#a-ink)"/>
<path class="e-pass" d="M556,70 L611,70" marker-end="url(#a-pass)"/>
<text class="l-pass mono" x="584" y="62" text-anchor="middle">pass</text>
<path class="edge" d="M510,104 L510,125" marker-end="url(#a-ink)"/>
<text class="lab mono" x="520" y="120">fail</text>
<path class="e-brass" d="M458,162 L214,162 L214,93" marker-end="url(#a-brass)"/>
<text class="l-brass mono" x="340" y="154" text-anchor="middle">yes · retry with findings</text>
<path class="e-esc" d="M562,162 L611,162" marker-end="url(#a-esc)"/>
<text class="l-esc mono" x="586" y="154" text-anchor="middle">no</text>
<path class="e-human" d="M677,184 L677,226 L182,226 L182,93" marker-end="url(#a-ink)"/>
<text class="note" x="432" y="218" text-anchor="middle">you run giro implement again · attempts reset</text>

<!-- ============ SPEC ============ -->
<text class="lane mono" x="16" y="270">SPEC</text>
<rect class="box" x="16" y="300" width="96" height="44" rx="7"/>
<text class="txt" x="64" y="327" text-anchor="middle">draft</text>
<rect class="box" x="210" y="300" width="130" height="44" rx="7"/>
<text class="txt" x="275" y="327" text-anchor="middle">active</text>
<rect class="box-pass" x="612" y="300" width="100" height="44" rx="7"/>
<text class="txt" x="662" y="327" text-anchor="middle">done</text>
<text class="note" x="724" y="327">you merge giro/&lt;slug&gt;</text>
<rect class="box-esc" x="612" y="370" width="130" height="44" rx="7"/>
<text class="txt" x="677" y="397" text-anchor="middle">needs-human</text>

<path class="edge" d="M112,322 L209,322" marker-end="url(#a-ink)"/>
<text class="lab mono" x="160" y="314" text-anchor="middle">first run</text>
<path class="e-brass" d="M250,300 C250,262 300,262 300,299" marker-end="url(#a-brass)"/>
<text class="l-brass mono" x="314" y="276">waves · Validate · gap Issues</text>
<path class="e-pass" d="M340,322 L611,322" marker-end="url(#a-pass)"/>
<text class="l-pass mono" x="476" y="314" text-anchor="middle">Validate green</text>
<text class="note" x="476" y="342" text-anchor="middle">every Issue terminal</text>
<path class="e-esc" d="M300,344 L300,392 L611,392" marker-end="url(#a-esc)"/>
<text class="l-esc mono" x="456" y="384" text-anchor="middle">Issue stuck or budget spent</text>
<path class="e-human" d="M677,414 L677,440 L250,440 L250,345" marker-end="url(#a-ink)"/>
<text class="note" x="464" y="458" text-anchor="middle">you run giro implement again · gap_cycles reset</text>
</svg>
