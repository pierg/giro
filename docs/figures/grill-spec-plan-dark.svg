<!-- issues -->
<text class="file mono" x="640" y="170">issues/</text>
<text class="note" x="702" y="170">slices of SPEC.md</text>
<rect class="chip" x="683" y="190" width="140" height="28" rx="5"/>
<text class="chip-t mono" x="753" y="209" text-anchor="middle">01-key-lookup</text>
<rect class="chip" x="640" y="262" width="112" height="28" rx="5"/>
<text class="chip-t mono" x="696" y="281" text-anchor="middle">02-one-route</text>
<rect class="chip" x="760" y="262" width="110" height="28" rx="5"/>
<text class="chip-t mono" x="815" y="281" text-anchor="middle">04-per-key</text>
