<path class="edge" d="M776,218 L806,260" marker-end="url(#a-ink)"/>
<path class="edge" d="M696,290 L696,328" marker-end="url(#a-ink)"/>
<text class="note mono" x="708" y="314">blocked_by</text>
<rect class="fence" x="640" y="370" width="230" height="48" rx="6"/>
<text class="note" x="652" y="390">every issue ends with its fence:</text>
<text class="esc" x="652" y="408">“Not in this Issue”</text>

<!-- ============ THEN GIRO ============ -->
<rect class="box-brass" x="16" y="450" width="868" height="76" rx="10"/>
<text class="brass mono" x="32" y="474">THEN GIRO BUILDS FROM THESE FILES</text>
<text class="t" x="32" y="496">Each worker is given CONTEXT.md, the spec and one issue; any edit it makes to them is reverted.</text>
<text class="note" x="32" y="515">Without giro they are plain markdown that any coding agent can read, and you can adjust the skills to your taste.</text>
</svg>
