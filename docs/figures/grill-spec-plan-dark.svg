<rect class="box" x="512" y="146" width="108" height="96" rx="8"/>
<text class="file mono" x="524" y="168">shape.svg</text>
<rect class="mini" x="524" y="184" width="22" height="16" rx="3"/>
<rect class="mini" x="555" y="184" width="22" height="16" rx="3"/>
<rect class="mini" x="586" y="184" width="22" height="16" rx="3"/>
