<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-label="What grill, spec and plan write, and how the files relate. You say: grill me on rate limiting; the grill skill writes CONTEXT.md, the glossary, for example Limit: the requests a key may make in one window, avoid quota and throttle, and an ADR, docs/adr/0007-token-bucket.md: token bucket, not a fixed window. Both outlive every spec. You say: write that up as a spec; the spec skill writes the folder docs/specs/rate-limit/ with SPEC.md, whose sections are problem statement, solution, user stories, shape, implementation decisions, testing decisions, docs impact and out of scope. The shape is a diagram drawn with any tool, here shape.svg in the same folder; each contract gets an inline example such as limit 100, window 60s. SPEC.md uses the glossary's words and respects the ADRs. You say: plan it into issues; the plan skill writes issues/ in the same folder, slices of SPEC.md: 01-key-lookup, then 02-one-route and 04-per-key, both blocked by 01, then 03-headers blocked by 02. Every issue ends with a Not in this Issue fence. Then giro builds from these files: each worker is given CONTEXT.md, the spec and one issue, and any edit it makes to them is reverted. Without giro they are plain markdown any agent reads." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
svg{--ink:#dbe3e9;--ink-soft:#9aa8b1;--ink-faint:#69767f;--rule:#253039;--brass:#d4a35c;--pass:#46b491;--escalate:#e07257;--panel-2:#101820;}
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace}
.box{fill:var(--panel-2);stroke:var(--ink-soft);stroke-width:1.5}
.box-brass{fill:var(--panel-2);stroke:var(--brass);stroke-width:1.8}
.container{fill:none;stroke:var(--ink-faint);stroke-width:1.4}
.folder{fill:none;stroke:var(--brass);stroke-width:1.8}
.dash{fill:none;stroke:var(--ink-faint);stroke-width:1.3;stroke-dasharray:4 4}
.fence{fill:none;stroke:var(--escalate);stroke-width:1.4;stroke-dasharray:4 3}
.bubble{fill:none;stroke:var(--ink-faint);stroke-width:1.3}
.chip{fill:none;stroke:var(--ink-faint);stroke-width:1.2}
.chip-brass{fill:none;stroke:var(--brass);stroke-width:1.6}
.rule{stroke:var(--rule);stroke-width:1.2}
.edge{fill:none;stroke:var(--ink-soft);stroke-width:1.5}
.e-brass{fill:none;stroke:var(--brass);stroke-width:1.7}
.link{fill:none;stroke:var(--ink-faint);stroke-width:1.4;stroke-dasharray:4 3}
.fill-ink{fill:var(--ink-soft)}.fill-brass{fill:var(--brass)}.fill-faint{fill:var(--ink-faint)}
.mini{fill:var(--panel-2);stroke:var(--ink-soft);stroke-width:1.2}
.t{fill:var(--ink);font-size:14px}
.sec{fill:var(--ink);font-size:13px}
.txt{fill:var(--ink);font-size:15px;font-weight:600}
.strong{fill:var(--ink);font-size:13.5px;font-weight:650}
.note{fill:var(--ink-soft);font-size:13px}
.em{fill:var(--ink-soft);font-size:13px;font-style:italic}
.lab{fill:var(--ink-soft);font-size:13px;letter-spacing:.06em}
.brass{fill:var(--brass);font-size:13px;letter-spacing:.06em;font-weight:700}
.file{fill:var(--ink);font-size:13.5px;font-weight:600}
.code{fill:var(--ink);font-size:13px}
.esc{fill:var(--escalate);font-size:13px}
.chip-t{fill:var(--ink);font-size:13px}
.chip-t-brass{fill:var(--brass);font-size:13.5px;font-weight:700}
</style>
<defs>
<marker id="a-ink" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" class="fill-ink"/></marker>
<marker id="a-faint" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" class="fill-faint"/></marker>
<marker id="a-brass" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" class="fill-brass"/></marker>
</defs>

<!-- ============ YOU SAY → SKILL ============ -->
<rect class="bubble" x="16" y="12" width="214" height="28" rx="14"/>
<text class="t" x="30" y="31">“grill me on rate limiting”</text>
<rect class="chip-brass" x="81" y="52" width="80" height="24" rx="5"/>
<text class="chip-t-brass mono" x="121" y="69" text-anchor="middle">grill</text>
<path class="e-brass" d="M121,76 L121,107" marker-end="url(#a-brass)"/>

<rect class="bubble" x="306" y="12" width="198" height="28" rx="14"/>
<text class="t" x="320" y="31">“write that up as a spec”</text>
<rect class="chip-brass" x="365" y="52" width="80" height="24" rx="5"/>
<text class="chip-t-brass mono" x="405" y="69" text-anchor="middle">spec</text>
<path class="e-brass" d="M405,76 L405,107" marker-end="url(#a-brass)"/>

<rect class="bubble" x="667" y="12" width="172" height="28" rx="14"/>
<text class="t" x="681" y="31">“plan it into issues”</text>
<rect class="chip-brass" x="713" y="52" width="80" height="24" rx="5"/>
<text class="chip-t-brass mono" x="753" y="69" text-anchor="middle">plan</text>
<path class="e-brass" d="M753,76 L753,107" marker-end="url(#a-brass)"/>

<!-- ============ OUTLIVES EVERY SPEC ============ -->
<rect class="container" x="16" y="108" width="210" height="324" rx="10"/>
<text class="lab mono" x="30" y="132">OUTLIVES EVERY SPEC</text>

<rect class="box" x="30" y="146" width="182" height="140" rx="8"/>
<text class="file mono" x="44" y="170">CONTEXT.md</text>
<text class="note" x="44" y="188">the glossary</text>
<line class="rule" x1="44" y1="198" x2="198" y2="198"/>
<text class="strong" x="44" y="219">Limit</text>
<text class="sec" x="44" y="238">requests a key may make</text>
<text class="sec" x="44" y="256">in one window.</text>
<text class="em" x="44" y="275">Avoid: quota, throttle</text>

<rect class="box" x="30" y="300" width="182" height="118" rx="8"/>
<text class="note mono" x="44" y="322">docs/adr/</text>
<text class="chip-t mono" x="44" y="340" style="font-weight:600">0007-token-bucket.md</text>
<line class="rule" x1="44" y1="351" x2="198" y2="351"/>
<text class="sec" x="44" y="372">Token bucket, not a</text>
<text class="sec" x="44" y="390">fixed window.</text>
<text class="note" x="44" y="408">a decision, hard to reverse</text>

<!-- relations: the spec obeys them -->
<path class="link" d="M310,232 L214,232" marker-end="url(#a-faint)"/>
<text class="note" x="261" y="206" text-anchor="middle">uses</text>
<text class="note" x="261" y="223" text-anchor="middle">its words</text>
<path class="link" d="M310,372 L214,372" marker-end="url(#a-faint)"/>
<text class="note" x="261" y="363" text-anchor="middle">respects</text>

<!-- ============ THE FEATURE'S FOLDER ============ -->
<rect class="folder" x="296" y="108" width="588" height="324" rx="10"/>
<text class="brass mono" x="310" y="132" style="letter-spacing:0">docs/specs/rate-limit/</text>
<text class="note" x="870" y="132" text-anchor="end">one folder per feature</text>

<!-- SPEC.md -->
<rect class="box" x="310" y="146" width="190" height="272" rx="8"/>
<text class="file mono" x="324" y="170">SPEC.md</text>
<line class="rule" x1="324" y1="182" x2="486" y2="182"/>
<text class="sec" x="324" y="204">Problem statement</text>
<text class="sec" x="324" y="228">Solution</text>
<text class="sec" x="324" y="252">User stories</text>
<text class="strong" x="324" y="276">Shape</text>
<text class="strong" x="324" y="300">Implementation decisions</text>
<text class="sec" x="324" y="324">Testing decisions</text>
<text class="sec" x="324" y="348">Docs impact</text>
<text class="sec" x="324" y="372">Out of scope</text>
<text class="note" x="324" y="402">no status, no lifecycle</text>

<!-- shape: a diagram, any tool -->
